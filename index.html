<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório de Pontuação</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Grimório da Pontuação</h1>
        <p class="instructions">Decifre as páginas perdidas preenchendo os feitiços com a pontuação correta.</p>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="controls">
            <div id="punctuation-buttons">
                <button class="punct-btn" data-punct=",">,</button>
                <button class="punct-btn" data-punct=".">.</button>
                <button class="punct-btn" data-punct="!">!</button>
                <button class="punct-btn" data-punct="?">?</button>
                <button class="punct-btn" data-punct=";">;</button>
                <button class="punct-btn" data-punct=":">:</button>
                <button class="punct-btn" data-punct="-">-</button>
                <button class="punct-btn" id="btn-remove">Remover</button>
            </div>
            <button id="btn-submit">Corrigir Pontuação</button>
            <button id="btn-next" style="display: none;">Continuar</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
